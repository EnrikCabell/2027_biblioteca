name: Deploy kitACA PWA to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Generate install icons
        run: |
          python -m pip install --quiet Pillow
          python - <<'PY'
          from PIL import Image
          original = Image.open("logo_kitACA.png").convert("RGBA")
          for size in (192, 512):
              source = original.copy()
              icon = Image.new("RGBA", (size, size), (255, 255, 255, 255))
              source.thumbnail((int(size * 0.82), int(size * 0.82)), Image.Resampling.LANCZOS)
              icon.alpha_composite(source, ((size - source.width) // 2, (size - source.height) // 2))
              icon.convert("RGB").save(f"kitaca-icon-{size}.png", format="PNG", optimize=True)
          PY
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
